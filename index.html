<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Para Erika 🌻</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;}

  #main-title{
    position:fixed;top:40px;left:0;right:0;width:100%;
    font-size:2.6em;color:#FFFACD;white-space:nowrap;
    text-shadow:0 0 10px #FFD700,0 0 18px #FFA500;
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  @media (max-width:768px){
    #main-title{font-size:1.55em;top:22px;white-space:normal;padding:0 10px;line-height:1.15;}
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}

  #start-heart{
    font-size:clamp(74px,23vmin,148px);line-height:1;display:block;
    filter:drop-shadow(0 0 14px rgba(255,215,0,.75)) drop-shadow(0 0 36px rgba(255,165,0,.38));
    animation:latido 1.35s ease-in-out infinite;transform-origin:50% 55%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.15);}
    24%{transform:scale(1);}
    36%{transform:scale(1.07);}
    50%{transform:scale(1);}
  }

  #start-message{
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    font-size:clamp(1.1em, 3.2vmin, 1.9em);
    color:#FFFACD;
    text-align:center;
    text-shadow:0 0 12px #FFD700, 0 0 22px #FFA500;
    max-width:90vw;
    line-height:1.3;
    margin-bottom:clamp(18px,3vh,32px);
    padding:0 10px;
    animation:brilloSuave 3s ease-in-out infinite;
  }
  @keyframes brilloSuave{
    0%,100%{opacity:.85; text-shadow:0 0 12px #FFD700, 0 0 22px #FFA500;}
    50%{opacity:1; text-shadow:0 0 18px #FFD700, 0 0 32px #FFA500, 0 0 44px #FF8C00;}
  }

  #start-text{
    font-size:1.8em;color:#FFFACD;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #FFD700;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}

  #music-button{
    position:fixed;right:18px;bottom:18px;z-index:20;
    border:1px solid rgba(255,215,0,.65);border-radius:999px;
    padding:10px 16px;background:rgba(0,0,0,.7);color:#FFFACD;
    font:1em 'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #FFD700;box-shadow:0 0 12px rgba(255,215,0,.35);
    cursor:pointer;
  }
  #music-button[hidden]{display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<h1 id="main-title">Feliz Día de las Flores Amarillas 🌻</h1>

<div id="start-screen">
  <div id="start-heart" aria-hidden="true">🌻</div>
  <div id="start-message">SIEMPRE ESTARÉ PARA CUIDAR DE TI MI POLLITA DE COLORES</div>
  <div id="start-text">Dale click mi pollita de colores</div>
</div>

<audio id="audio" loop preload="auto" playsinline>
  <source src="assets/musica.mp3" type="audio/mpeg">
</audio>
<button id="music-button" type="button" hidden>🔇 Activar música</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ================= CONFIGURACIÓN — EDITA AQUÍ =================
const CONFIG = {
  titulo: "Feliz Día de las Flores Amarillas 🌻",
  frases: [
    "🌻 Novia hermosa",
    "🌼 Mujer trabajadora",
    "🌻 Mi pollita de colores",
    "💛 Airbag siempre lo mejor",
    "🌼 Siempre junto bobita",
    "🌻 Vladimir y Erika juntos por siempre",
    "🌼 Como el girasol, miro hacia ti",
    "🌻 Gracias por ser mi sol de siempre",
    "🌼 Contigo hasta lo simple brilla",
    "🌻 Hoy el amarillo lleva tu nombre",
    "🌼 Esta flor te recuerda cuánto vales",
    "🌻 Eres mi lugar favorito",
    "🌼 21 de septiembre, contigo siempre",
    "🌻 Un girasol para quien ilumina",
    "🌼 Gracias por quedarte siempre",
    "🌻 Contigo el día pesa menos"
  ],
  fotos: [
    "assets/img1.jpeg",
    "assets/img2.jpeg",
    "assets/img3.jpeg",
    "assets/img4.jpeg"
  ],
  musica: "assets/musica.mp3"
};
// ==============================================================

document.getElementById('main-title').textContent = CONFIG.titulo;
const audio = document.getElementById('audio');
audio.querySelector('source').src = CONFIG.musica;
audio.load();
const musicButton = document.getElementById('music-button');

// ================= ESCENA =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
function resizeRenderer(){
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  const maxWidth = 3840;
  const maxHeight = 2160;
  const width = Math.min(innerWidth, maxWidth/pixelRatio);
  const height = Math.min(innerHeight, maxHeight/pixelRatio);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(width, height, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);
let targetDist = 300, currentDist = 300, rotX = 0.2, rotY = 0;
resizeRenderer();
addEventListener('resize', resizeRenderer);

// Estrellas
(function makeStars(count=2000, spread=3000){
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = spread*(0.3+Math.random()*0.7);
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3+0] = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.cos(ph);
    pos[i*3+2] = r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// Luces
const light = new THREE.PointLight(0xffffff, 1, 1000);
light.position.set(200, 200, 200);
scene.add(light);
scene.add(new THREE.HemisphereLight(0xfff4cc, 0x332211, 1.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.55));

// Glow
const GLOW_BASE = 360;
function makeGlow(size=768, c1='255,235,130', c2='255,180,0'){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size/2,size/2,size*0.05, size/2,size/2,size*0.5);
  grad.addColorStop(0, 'rgba('+c1+',0.55)');
  grad.addColorStop(0.5, 'rgba('+c2+',0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(), transparent:true, depthWrite:false}));
glow.scale.set(GLOW_BASE, GLOW_BASE, 1);
scene.add(glow);

// Girasol 3D central con colores explícitos
const bouquet = new THREE.Group();
scene.add(bouquet);
const petalMaterial = new THREE.MeshPhongMaterial({
  color:0xffd21f, emissive:0x6b3d00, emissiveIntensity:0.18, shininess:55,
  side:THREE.DoubleSide
});
const centerMaterial = new THREE.MeshPhongMaterial({
  color:0x63300f, emissive:0x180800, emissiveIntensity:0.15, shininess:25
});
const greenMaterial = new THREE.MeshPhongMaterial({color:0x329447, shininess:40});
const flower = new THREE.Group();
bouquet.add(flower);

function makePetalGeometry(){
  const rows = [
    {y:0, width:2, z:0},
    {y:7, width:8, z:1.2},
    {y:17, width:11, z:2.8},
    {y:27, width:7, z:4.2},
    {y:34, width:1, z:4.8}
  ];
  const vertices = [];
  rows.forEach(row=>{
    vertices.push(-row.width, row.y, row.z, row.width, row.y, row.z);
  });
  const faces = [];
  for(let i=0;i<rows.length-1;i++){
    const a=i*2, b=(i+1)*2;
    faces.push(a,b,b+1, a,b+1,a+1);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));
  geometry.setIndex(faces);
  geometry.computeVertexNormals();
  return geometry;
}
const petalGeometry = makePetalGeometry();
for(let i=0;i<20;i++){
  const angle = i*Math.PI*2/20;
  const petal = new THREE.Mesh(petalGeometry, petalMaterial);
  petal.scale.set(1.0, 1.0, 1.0);
  petal.position.set(Math.cos(angle)*20, Math.sin(angle)*20, 0);
  petal.rotation.z = angle;
  flower.add(petal);
}
const flowerCenter = new THREE.Mesh(new THREE.SphereGeometry(25, 36, 24), centerMaterial);
flowerCenter.scale.z = 0.4;
flower.add(flowerCenter);

for(let i=0;i<52;i++){
  const angle = i*2.39996;
  const radius = 4+Math.sqrt(i/52)*18;
  const seed = new THREE.Mesh(
    new THREE.SphereGeometry(1.45, 10, 8),
    new THREE.MeshBasicMaterial({color:0xa8662b})
  );
  seed.position.set(Math.cos(angle)*radius, Math.sin(angle)*radius, 11);
  seed.scale.z = 0.45;
  flower.add(seed);
}

const stem = new THREE.Mesh(new THREE.CylinderGeometry(5, 7, 92, 24), greenMaterial);
stem.position.y = -51;
bouquet.add(stem);

function addSunflowerLeaf(x, y, rotation){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.quadraticCurveTo(15,10,38,0);
  shape.quadraticCurveTo(15,-10,0,0);
  const leafGeometry = new THREE.ShapeGeometry(shape);
  const leaf = new THREE.Mesh(leafGeometry, greenMaterial);
  leaf.scale.set(1, 1, 1);
  leaf.position.set(x, y, 0);
  leaf.rotation.z = rotation;
  bouquet.add(leaf);
}
addSunflowerLeaf(-17, -57, -0.42);
addSunflowerLeaf(17, -67, 0.42);

const calyx = new THREE.Mesh(new THREE.ConeGeometry(12, 16, 12), greenMaterial);
calyx.position.y = 3;
bouquet.add(calyx);
flower.position.y = 30;

const bouquetShadow = new THREE.Mesh(
  new THREE.CircleGeometry(75, 48),
  new THREE.MeshBasicMaterial({color:0x2b1700, transparent:true, opacity:0.28})
);
bouquetShadow.scale.y = 0.32;
bouquetShadow.position.set(0, -120, -4);
bouquet.add(bouquetShadow);

// Usa la misma silueta y colores del girasol emoji que acompaña las frases.
const iconCanvas = document.createElement('canvas');
iconCanvas.width = iconCanvas.height = 256;
const iconContext = iconCanvas.getContext('2d');
iconContext.textAlign = 'center';
iconContext.textBaseline = 'middle';
iconContext.font = '210px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
iconContext.fillText('🌻', 128, 132);
const iconTexture = new THREE.CanvasTexture(iconCanvas);
iconTexture.needsUpdate = true;
const iconSunflower = new THREE.Sprite(new THREE.SpriteMaterial({
  map:iconTexture,
  transparent:true,
  depthWrite:false
}));
iconSunflower.scale.set(150, 150, 1);
iconSunflower.position.set(0, 15, 12);
bouquet.children.forEach(child=>{ child.visible = false; });
bouquet.add(iconSunflower);

// Frases alrededor
const frasesBase = CONFIG.frases;
const WORD_SLOTS = 150;
const WORDS = Array.from({length:WORD_SLOTS}, (_,i)=>frasesBase[i%frasesBase.length]);

function makeTextTexture(text, color){
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.shadowColor = color; ctx.shadowBlur = 30;
  const maxWidth = c.width-48;
  let fontSize = 60;
  ctx.font = fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width > maxWidth && fontSize > 24){
    fontSize -= 2;
    ctx.font = fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text, c.width/2, c.height/2);
  return new THREE.CanvasTexture(c);
}

const COLORS = ['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#e6b800','#ffdb58','#f0c419'];
const textGroup = new THREE.Group(); scene.add(textGroup);
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const tex = makeTextTexture(WORDS[i], COLORS[i%COLORS.length]);
    const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
    const sp = new THREE.Sprite(mat);
    sp.scale.set(68, 21.8, 1);
    const phi = Math.acos(2*Math.random()-1); const theta = Math.random()*Math.PI*2;
    const r = 150+Math.random()*120;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
    sp.userData = {phi, theta, radius:r, speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

// Fotos
const fotosBase = CONFIG.fotos;
function makePhotoSprite(url, size){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(size, size, 1);
  const img = new Image();
  img.onload = ()=>{
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    const s = Math.min(c.width/img.width, c.height/img.height);
    ctx.drawImage(img, (c.width-img.width*s)/2, (c.height-img.height*s)/2, img.width*s, img.height*s);
    tex.needsUpdate = true;
    const aspect = img.naturalWidth/img.naturalHeight;
    const aX = Math.min(1,aspect), aY = Math.min(1, 1/aspect);
    sp.scale.set(size*aX, size*aY, 1);
    sp.renderOrder = 2;
  };
  img.onerror = ()=>{};
  img.src = url;
  return sp;
}
const photoGroup = new THREE.Group(); scene.add(photoGroup);
const PHOTO_COUNT = 26;
for(let i=0;i<PHOTO_COUNT;i++){
  const url = fotosBase[i%fotosBase.length];
  const size = 28+Math.random()*20;
  const sp = makePhotoSprite(url, size);
  sp.renderOrder = 2;
  const phi = Math.acos(2*Math.random()-1); const theta = Math.random()*Math.PI*2;
  const r = 140+Math.random()*170;
  sp.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
  sp.userData = {phi, theta, radius:r, speed:0.0006+Math.random()*0.0012};
  photoGroup.add(sp);
}

// Controles
let dragging=false, lastX=0, lastY=0;
function onDown(e){dragging=true; const t=e.touches?e.touches[0]:e; lastX=t.clientX; lastY=t.clientY;}
function onMove(e){
  if(!dragging) return;
  const t = e.touches?e.touches[0]:e;
  const dx = (t.clientX-lastX)/innerWidth;
  const dy = (t.clientY-lastY)/innerHeight;
  rotY -= dx*5;
  rotX = Math.max(-1.2, Math.min(1.2, rotX+dy*3.5));
  lastX = t.clientX; lastY = t.clientY;
}
function onUp(){dragging=false;}
addEventListener('mousedown', onDown);
addEventListener('mousemove', onMove);
addEventListener('mouseup', onUp);
addEventListener('touchstart', onDown, {passive:true});
addEventListener('touchmove', onMove, {passive:true});
addEventListener('touchend', onUp, {passive:true});
addEventListener('wheel', (e)=>{
  targetDist += e.deltaY*0.25;
  targetDist = Math.max(160, Math.min(600, targetDist));
}, {passive:true});

let pinch = 0;
addEventListener('touchmove', (e)=>{
  if(e.touches && e.touches.length===2){
    e.preventDefault();
    const dx = e.touches[0].clientX-e.touches[1].clientX;
    const dy = e.touches[0].clientY-e.touches[1].clientY;
    const d = Math.hypot(dx,dy);
    if(pinch){targetDist += (pinch-d)*0.5; targetDist = Math.max(160, Math.min(600, targetDist));}
    pinch = d;
  }
}, {passive:false});
addEventListener('touchend', ()=>{pinch=0;}, {passive:true});

// Animación
let t = 0;
function tick(){
  requestAnimationFrame(tick); t += 0.01;
  glow.scale.set(GLOW_BASE*(1+Math.sin(t*0.4)*0.03), GLOW_BASE*(1+Math.sin(t*0.4)*0.03), 1);
  const s = 1.0+0.05*Math.sin(t*3);
  bouquet.rotation.y = Math.sin(t*0.45)*0.16;
  bouquet.rotation.z = Math.sin(t*0.8)*0.025;
  bouquet.scale.set(s,s,s);
  textGroup.children.forEach(sp=>{
    sp.material.opacity = 0.8+0.2*Math.sin(t*2);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  photoGroup.children.forEach(sp=>{
    sp.material.opacity = 0.85+0.15*Math.sin(t*2+sp.userData.radius);
    sp.userData.theta += sp.userData.speed;
    sp.position.x = sp.userData.radius*Math.sin(sp.userData.phi)*Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius*Math.sin(sp.userData.phi)*Math.sin(sp.userData.theta);
  });
  currentDist += (targetDist-currentDist)*0.06;
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  camera.position.set(currentDist*sy*cx, currentDist*sx, currentDist*cy*cx);
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
}
tick();

// Arranque
const startScreen = document.getElementById('start-screen');
function playMusic(){
  audio.muted = false;
  audio.volume = 1;
  return audio.play().then(()=>{
    musicButton.hidden = true;
  }).catch(()=>{
    musicButton.hidden = false;
  });
}
function startExperience(){
  startScreen.classList.add('hidden');
  setTimeout(()=>startScreen.style.display='none', 800);
  playMusic();
}
startScreen.addEventListener('pointerdown', startExperience, {once:true});
musicButton.addEventListener('click', playMusic);
</script>
</body>
</html>
